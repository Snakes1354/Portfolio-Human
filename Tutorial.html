        <h3>Tutorial system</h3>
        <p> This script is used to start the tutorial enemy. You basicly have to beat this dummy and when you beat the dummy the blocker disappears and you are able to escape the first room. </p>

<script type="text/plain" id="source">
using UnityEngine;
using System.Collections;
using System.Collections.Generic;

public class Tutorial : MonoBehaviour
{
    //VARIABLES
    [SerializeField] private int CurrentHealthTu = 2;
    [SerializeField] private int MaxHealthTu = 3;

    void Awake()
    {
        CurrentHealthTu = MaxHealthTu;
        // Sets hp at the start.
    }

    public void TakeDamage(int amountTu)
    {
        CurrentHealthTu -= amountTu;
        // Makes it take damage.

        if(CurrentHealthTu <= 0)
        {
            Death();
            KillManager.PrintEnemyCount();
            // Call Death method when it hits 0 hp.
        }
    }

    void Death()
    {
        Destroy(gameObject);
        // Death function
        // Temporary: Destroy Object
    }
}
</script>
