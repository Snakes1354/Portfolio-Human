    <div class="explanation">
        <h3>Enemy Death system</h3>
        <p> This script is used to allow my enemy to die, when the enemy dies it also checks the variable drop chance and then takes the drop chance and if it hits the drop chance it summons a chest.</p>
    </div>


<script type="text/plain" id="source">
public void TakeDamage(int amount)
{
    {
        CurrentHealth -= amount;
        // Makes it take damage.

        healthBar.UpdateHealthBar(CurrentHealth, MaxHealth);

        if(CurrentHealth <= 0)
        {
            Death();
            ExpManager.Instance.AddExperience(ExpAmount);
            // Call Death method when it hits 0 hp.
        }
    }

    void Death()
    {
        KillManager.PrintEnemyCount();

        if (Random.value <= DropChance)
        {
            RaycastHit hit;

            if (Physics.Raycast(transform.position + Vector3.up * 2f, Vector3.down, out hit, 10f))
            {
                GameObject newchest = Instantiate(Chest, hit.point + Vector3.down * 1f, Quaternion.identity);
                newchest.SetActive(true);
            }
            else
            {
                Instantiate(Chest, transform.position, Quaternion.identity);
            }
        }

        Destroy(gameObject);
    }

    private void OnDrawGizmos()
    {
        Gizmos.color = Color.red;
        Gizmos.DrawWireSphere(transform.position, attackRange);
        Gizmos.color = Color.yellow;
        Gizmos.DrawWireSphere(transform.position, aggroRange);
    }
}
</script>
