    <div class="explanation">
        <h3>Blocker System</h3>
        <p> In my game I used this to system to disable barriers and also set barriers behind the player so they can not run back after killing all the enemies.</p>
    </div>


<script type="text/plain" id="source">
using UnityEngine;

public class Blocker1 : MonoBehaviour
{

    public GameObject blocker1;
    public GameObject Gate;

    void OnTriggerEnter(Collider collision)
    {
        if(!collision.CompareTag("Player")) return;
        {
            Gate.SetActive(false);
            blocker1.SetActive(true);
        }
    }

}
</script>
